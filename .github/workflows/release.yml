name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -C packages/dsh-livestream build

      - name: Pack tarball
        run: pnpm -C packages/dsh-livestream pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/dsh-livestream/*.tgz
          generate_release_notes: true

      - name: Publish to npm (only if NPM_TOKEN secret is configured)
        if: env.NPM_TOKEN != ''
        run: |
          set -e
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          npm publish "$(ls packages/dsh-livestream/dsh-livestream-*.tgz)" --access public
