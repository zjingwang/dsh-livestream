name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C packages/dsh-livestream check

      - name: Unit tests
        run: pnpm -C packages/dsh-livestream test

      - name: Build
        run: pnpm -C packages/dsh-livestream build
